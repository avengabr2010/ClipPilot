name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download offline speech model (Vosk, French)
        run: |
          curl -sSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q /tmp/model.zip -d /tmp/model
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/model-fr
          mv /tmp/model/vosk-model-small-fr-0.22 android/app/src/main/assets/model-fr

      - name: Optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.2.${GITHUB_RUN_NUMBER}" ;; esac
          gradle --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_WORKSPACE/ClipPilot-$VERSION.apk"
          echo "APK=$RUNNER_WORKSPACE/ClipPilot-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipPilot-apk
          path: ${{ env.APK }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: ClipPilot ${{ env.VERSION }} (Android)
          files: ${{ env.APK }}
          body: |
            APK Android de ClipPilot.

            Installation : téléchargez le fichier `.apk` sur le téléphone, ouvrez-le, autorisez « Installer des applis inconnues » pour votre navigateur, puis installez.
            Application 100 % locale : transcription (Vosk), analyse, recadrage (ML Kit) et montage (Media3) sur le téléphone. Aucune connexion Internet, aucun compte.
            Android 10 minimum. Les clips sont enregistrés dans Galerie › Movies/ClipPilot.
